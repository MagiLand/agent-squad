[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-squad"
version = "0.4.4"
description = "Coordinate an implementation agent and an independent review agent through Herdr."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
agent-squad = "agent_squad.cli:main"

[project.urls]
Repository = "https://github.com/MagiLand/agent-squad"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["agent_squad*"]
namespaces = false
